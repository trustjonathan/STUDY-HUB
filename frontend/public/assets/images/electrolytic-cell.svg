<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title description">
  <title id="title">Electrolytic cell</title>
  <desc id="description">A battery drives a non-spontaneous reaction. The negative cathode attracts cations and the positive anode attracts anions.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#315e76"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="22" fill="#f4f8fb"/>
  <text x="360" y="42" fill="#173247" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">ELECTROLYTIC CELL</text>
  <path d="M186 145v153q0 20 20 20h308q20 0 20-20V145" fill="#fff" stroke="#527287" stroke-width="5"/>
  <path d="M190 229h340v67q0 18-18 18H208q-18 0-18-18z" fill="#c9e4f0"/>
  <text x="360" y="286" fill="#315e76" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">electrolyte</text>
  <path d="M270 112v137" stroke="#566575" stroke-width="14" stroke-linecap="round"/>
  <path d="M450 112v137" stroke="#566575" stroke-width="14" stroke-linecap="round"/>
  <text x="270" y="95" fill="#173247" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">CATHODE (−)</text>
  <text x="450" y="95" fill="#173247" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">ANODE (+)</text>
  <circle cx="360" cy="105" r="37" fill="#fff" stroke="#315e76" stroke-width="4"/>
  <text x="360" y="113" fill="#173247" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">DC</text>
  <path d="M270 112V105h53m74 0h53v7M270 105V98m180 7V98" fill="none" stroke="#315e76" stroke-width="4"/>
  <path d="M342 93v24m36-24v24" stroke="#315e76" stroke-width="4"/>
  <text x="342" y="84" fill="#315e76" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">−</text>
  <text x="378" y="84" fill="#315e76" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">+</text>
  <path d="M320 205H284" fill="none" stroke="#315e76" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M400 205h36" fill="none" stroke="#315e76" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="313" y="195" fill="#1d78a8" font-family="Arial,sans-serif" font-size="18" font-weight="700">+</text>
  <text x="400" y="195" fill="#c65d4b" font-family="Arial,sans-serif" font-size="18" font-weight="700">−</text>
  <text x="260" y="366" fill="#173247" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Cations → cathode</text>
  <text x="460" y="366" fill="#173247" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Anions → anode</text>
</svg>
