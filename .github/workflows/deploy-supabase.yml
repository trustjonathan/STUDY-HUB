name: Deploy Supabase upload pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUBMISSION_RATE_LIMIT_SALT: ${{ secrets.SUBMISSION_RATE_LIMIT_SALT }}
      CONTRIBUTION_CLEANUP_SECRET: ${{ secrets.CONTRIBUTION_CLEANUP_SECRET }}
      STUDY_HUB_ALLOWED_ORIGINS: ${{ vars.STUDY_HUB_ALLOWED_ORIGINS || 'https://trustjonathan.github.io,http://localhost:4321,http://127.0.0.1:4321' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUBMISSION_RATE_LIMIT_SALT CONTRIBUTION_CLEANUP_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the $name GitHub secret or variable before deploying Supabase."
              exit 1
            fi
          done
          if [[ "$SUPABASE_ACCESS_TOKEN" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase Personal Access Token beginning with sbp_. Replace the repository secret; do not use an anon/service-role API key, JWT, or database password."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --yes

      - name: Set upload service secrets
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            "SUBMISSION_RATE_LIMIT_SALT=$SUBMISSION_RATE_LIMIT_SALT" \
            "CONTRIBUTION_CLEANUP_SECRET=$CONTRIBUTION_CLEANUP_SECRET" \
            "STUDY_HUB_ALLOWED_ORIGINS=$STUDY_HUB_ALLOWED_ORIGINS"

      - name: Deploy upload Edge Functions
        run: |
          for function in \
            submit-resource-contribution \
            submit-biology-resource \
            submit-chemistry-resource \
            submit-math-resource \
            start-resource-contribution \
            finalize-resource-contribution \
            cancel-resource-contribution \
            cleanup-contribution-staging; do
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done

      - name: Verify upload function preflight
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          response=$(curl --silent --show-error --include --request OPTIONS \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/start-resource-contribution" \
            --header "Origin: https://trustjonathan.github.io" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: apikey,authorization,content-type,x-client-info")
          printf '%s\n' "$response"
          if ! printf '%s' "$response" | grep -Eiq '^HTTP/[^ ]+ 204'; then
            echo "::error::Upload function preflight did not return HTTP 204."
            exit 1
          fi
          if ! printf '%s' "$response" | grep -Fiq 'access-control-allow-origin: https://trustjonathan.github.io'; then
            echo "::error::Upload function preflight did not allow the production site origin."
            exit 1
          fi
          if ! printf '%s' "$response" | grep -Eiq 'access-control-allow-headers:.*x-client-info'; then
            echo "::error::Upload function preflight did not allow the Supabase client-info header."
            exit 1
          fi
