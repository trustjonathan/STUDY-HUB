name: Deploy Supabase upload pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      SUBMISSION_RATE_LIMIT_SALT: ${{ secrets.SUBMISSION_RATE_LIMIT_SALT }}
      CONTRIBUTION_CLEANUP_SECRET: ${{ secrets.CONTRIBUTION_CLEANUP_SECRET }}
      STUDY_HUB_ALLOWED_ORIGINS: ${{ vars.STUDY_HUB_ALLOWED_ORIGINS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF TURNSTILE_SECRET_KEY SUBMISSION_RATE_LIMIT_SALT CONTRIBUTION_CLEANUP_SECRET STUDY_HUB_ALLOWED_ORIGINS; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the $name GitHub secret or variable before deploying Supabase."
              exit 1
            fi
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --yes

      - name: Set upload service secrets
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY" \
            "SUBMISSION_RATE_LIMIT_SALT=$SUBMISSION_RATE_LIMIT_SALT" \
            "CONTRIBUTION_CLEANUP_SECRET=$CONTRIBUTION_CLEANUP_SECRET" \
            "STUDY_HUB_ALLOWED_ORIGINS=$STUDY_HUB_ALLOWED_ORIGINS"

      - name: Deploy upload Edge Functions
        run: |
          for function in \
            submit-resource-contribution \
            submit-biology-resource \
            submit-chemistry-resource \
            submit-math-resource \
            start-resource-contribution \
            finalize-resource-contribution \
            cancel-resource-contribution \
            cleanup-contribution-staging; do
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done
