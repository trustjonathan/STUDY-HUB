name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build Astro site
        run: npm run build
        working-directory: frontend
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || 'https://ttuxelhyoctyshgvjykj.supabase.co' }}
          PUBLIC_STUDY_HUB_API_URL: ${{ vars.PUBLIC_STUDY_HUB_API_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0dXhlbGh5b2N0eXNoZ3ZqeWtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTUxMjAsImV4cCI6MjEwNTM5MTEyMH0.pHHm2jWhaWNMUkMR5wpUEFGf7kwk3wFJ_2Wr4oG1xrY' }}
      - name: Verify public upload configuration
        run: |
          if [ -z "$PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set PUBLIC_SUPABASE_ANON_KEY before deploying the reader."
            exit 1
          fi
        env:
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || '******' }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4