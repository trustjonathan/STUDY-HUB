name: 💡 Feature Request
description: Propose a new feature, learning tool, or UI improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting an idea helps Study Hub grow into a better tool for students and teachers!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: I am always frustrated when trying to read notes in bright daylight...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you have evaluated.
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Study Workspace & PWA
        - Document Reader / Flipbook
        - AI Tutor & Planner
        - Subject & Notes Catalog
        - Account & Profile Management
        - Performance & Low-Bandwidth Optimizations
        - Developer Tooling & Testing
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      options:
        - label: I would be interested in submitting a pull request for this feature!
