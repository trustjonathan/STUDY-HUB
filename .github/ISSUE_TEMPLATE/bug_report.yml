name: 🐛 Bug Report
description: Report a broken feature, broken link, layout flaw, or error.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I click on the Biology S4 notes download button, nothing happens...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers or contributors reproduce this behavior?
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Frontend / UI Layout
        - Document Reader / Flipbook
        - AI Study Assistant / Gemini
        - Library Catalog & Search
        - Account / Auth / Profile
        - Document Payments
        - Database / Backend API
        - Documentation / Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device & Browser
      description: e.g. Infinix Hot 10 / Chrome 124, Windows 11 / Firefox 128
      placeholder: Techno Camon 19 / Mobile Chrome
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Console Logs
      description: Drag and drop screenshots or paste browser console errors here.
    validations:
      required: false
